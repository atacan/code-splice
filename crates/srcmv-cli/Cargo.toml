[package]
name = "codesplice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line application for CodeSplice"

[[bin]]
name = "codesplice"
path = "src/main.rs"

[dependencies]
codesplice-core = { path = "../codesplice-core" }
codesplice-fs = { path = "../codesplice-fs" }
codesplice-lsp = { path = "../codesplice-lsp" }
codesplice-protocol = { path = "../codesplice-protocol" }
clap.workspace = true
gen-lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[dev-dependencies]
codesplice-test-support = { path = "../codesplice-test-support" }
proptest = "1.7.0"
tempfile = "3.23.0"

[[test]]
name = "select_cli"
path = "tests/select_cli.rs"
harness = false

[lints]
workspace = true
